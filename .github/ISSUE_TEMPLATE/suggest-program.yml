name: Suggest a program
description: Tell us about a grant, fellowship or program the Funding Finder is missing, or a correction to one it lists.
title: "Suggestion: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the list complete. Each suggestion is checked against the funder's own page before it is added, usually within a week.
  - type: input
    id: name
    attributes:
      label: Program name
      placeholder: e.g. Pew Biomedical Scholars
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the funder's page
      description: Leave blank only for a Yale internal call that has no web page, and attach its PDF below.
      placeholder: https://
  - type: textarea
    id: pdf
    attributes:
      label: Yale internal call with no web page? Attach the call document (PDF)
      description: Drag the PDF into this box. Only for Yale programs, and the PDF must name the Yale office or contact person running the call. PDFs for non-Yale programs can't be accepted; please link the funder's page instead.
  - type: input
    id: contact
    attributes:
      label: Yale office or contact for the call (PDF only)
      placeholder: e.g. Yale Center for X, jane.doe@yale.edu
  - type: input
    id: deadline
    attributes:
      label: Next deadline, if known
      placeholder: e.g. Feb 1, 2027
  - type: checkboxes
    id: stages
    attributes:
      label: Who can apply?
      options:
        - label: Undergraduates
        - label: Graduate students
        - label: Postdocs
        - label: Early-career faculty
        - label: Established faculty
  - type: dropdown
    id: kind
    attributes:
      label: Is this a new program or a correction?
      options:
        - New program
        - Correction to a listed program
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Research area, eligibility, or what needs correcting.
